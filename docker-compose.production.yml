# Production config
services:
  nginx:
    depends_on:
      - panel
    volumes:
      - '/etc/letsencrypt/live:/etc/letsencrypt/live:ro'
      - '/etc/letsencrypt/archive:/etc/letsencrypt/archive:ro'

  panel:
    container_name: panel
    build:
      context: ./.
      target: runner
    networks:
      - database
      - nginx
      - redis
    restart: unless-stopped
    user: "1000:988"
    volumes:
      - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
      - 'state:/home/node/state'
      - 'nginx-conf:/home/node/nginx.conf.d'
    environment:
      - DOCKER_LOG_PATH=/var/lib/docker/containers

  worker:
    build:
      context: ./.
      target: runner
    command: ["npm", "run", "worker"]
    networks:
      - database
      - nginx
      - redis
    restart: unless-stopped
    volumes:
      - 'state:/home/node/state'
      - 'nginx-conf:/home/node/nginx.conf.d'
    environment:
      - DOCKER_LOG_PATH=/var/lib/docker/containers

networks:
  database:
  nginx:
  redis:

volumes:
  state:
  nginx-conf:
