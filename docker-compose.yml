version: '3.9'
services:

  redis:
    image: redis
    networks:
      - redis

  nginx:
    image: nginx:1.21.3-alpine
    ports:
      - '80:80'
      - '443:443'
    networks:
      - nginx
    restart: "no"
    volumes:
      - 'nginx-conf:/etc/nginx/conf.d/servers:ro'
      - './config/panel.conf:/etc/nginx/conf.d/default.conf:ro'

  report-runner:
    image: specifyconsortium/report-runner
    volumes:
      - './report-fonts.jar:/var/lib/jetty/webapps/ROOT/WEB-INF/lib/report-fonts.jar:ro'
    networks:
      - database

  worker:
    build:
      context: ./.
      target: runner
    command: ["npm", "run", "worker"]
    networks:
      - database
      - nginx
      - redis
    restart: unless-stopped
    user: "1000:988"
    volumes:
      - 'state:/home/node/state'
      - 'nginx-conf:/home/node/nginx.conf.d'
    environment:
      - DOCKER_LOG_PATH=/var/lib/docker/containers

volumes:
  database:
  state:
  nginx-conf:

networks:
  database:
  nginx:
  redis:
